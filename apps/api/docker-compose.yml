services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-FM9Lwrc75HQeaDaubn2tzjcXxH7GEpEeM/eWEEAgXNA=}
      POSTGRES_DB: ${DB_NAME:-kamusi}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-FM9Lwrc75HQeaDaubn2tzjcXxH7GEpEeM/eWEEAgXNA=}
      DB_NAME: ${DB_NAME:-kamusi}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
